<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户电话时间</title><style>body{margin:0;background:#f3f6f4;color:#17302a;font:16px system-ui}header{background:#123d32;color:white;padding:24px 18px}h1{margin:0 0 8px;font-size:27px}main{max-width:780px;margin:auto;padding:16px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #bacbc2;border-radius:12px;font-size:16px}.meta{color:#587066;font-size:13px;margin:12px 0}.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #183f3110}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.name{font-weight:700}.clock{font-size:21px;font-weight:700;white-space:nowrap}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:12px;margin-top:10px;background:#e7efe9;color:#295344}.good{background:#d9f4dc;color:#155b27}.bad{background:#fff0d5;color:#754800}.small{color:#63776e;font-size:13px;margin-top:8px}footer{font-size:12px;color:#697e73;padding:20px 4px}</style><header><h1>客户电话时间</h1><div>按客户池覆盖的国家查看当地时间与适合拨打的时段</div></header><main><input id="q" placeholder="搜索国家或地区" aria-label="搜索国家或地区"><div class="meta" id="summary"></div><div id="list"></div><footer>建议工作日当地时间 09:00–12:00、14:00–18:00 拨打。实际工作时间、节假日和联系人习惯请另行确认。刚果按布拉柴维尔时区，印度尼西亚按雅加达时区；跨时区国家请核实客户城市。</footer></main><script>
const data=[['阿拉伯联合酋长国',29,'Asia/Dubai'],['加纳',28,'Africa/Accra'],['菲律宾',20,'Asia/Manila'],['肯尼亚',18,'Africa/Nairobi'],['乌干达',18,'Africa/Kampala'],['巴基斯坦',12,'Asia/Karachi'],['坦桑尼亚',12,'Africa/Dar_es_Salaam'],['科特迪瓦',11,'Africa/Abidjan'],['卡塔尔',10,'Asia/Qatar'],['沙特阿拉伯',10,'Asia/Riyadh'],['马来西亚',8,'Asia/Kuala_Lumpur'],['阿曼',8,'Asia/Muscat'],['孟加拉国',7,'Asia/Dhaka'],['斯里兰卡',6,'Asia/Colombo'],['黎巴嫩',6,'Asia/Beirut'],['越南',4,'Asia/Ho_Chi_Minh'],['新加坡',4,'Asia/Singapore'],['科威特',2,'Asia/Kuwait'],['印度尼西亚',2,'Asia/Jakarta'],['乍得',2,'Africa/Ndjamena'],['马拉维',2,'Africa/Blantyre'],['利比里亚',2,'Africa/Monrovia'],['圭亚那',2,'America/Guyana'],['喀麦隆',2,'Africa/Douala'],['约旦',2,'Asia/Amman'],['刚果',2,'Africa/Brazzaville'],['印度',2,'Asia/Kolkata'],['塞拉利昂',2,'Africa/Freetown'],['几内亚',2,'Africa/Conakry'],['冈比亚',2,'Africa/Banjul'],['卢旺达',1,'Africa/Kigali'],['以色列',1,'Asia/Jerusalem']];
function parts(tz){let a=new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());return Object.fromEntries(a.map(x=>[x.type,x.value]))}function render(){let q=document.querySelector('#q').value.trim(),rows=data.filter(x=>x[0].includes(q));document.querySelector('#summary').textContent=`${rows.length} 个国家或地区 · 时间每分钟更新`;document.querySelector('#list').innerHTML=rows.map(([name,count,tz])=>{let p=parts(tz),h=+p.hour,weekend=['Sat','Sun'].includes(p.weekday),good=!weekend&&((h>=9&&h<12)||(h>=14&&h<18)),label=weekend?'当地周末':good?'适合拨打':'建议稍后拨打';return `<article class="card"><div class="top"><div class="name">${name}</div><div class="clock">${p.hour}:${p.minute}</div></div><span class="pill ${good?'good':'bad'}">${label}</span><div class="small">客户池 ${count} 条 · ${tz} · 当地 ${p.weekday}</div></article>`}).join('')||'<p>没有匹配的国家或地区</p>'}document.querySelector('#q').oninput=render;render();setInterval(render,60000);
</script></html>
